<!DOCTYPE html>
<html>
<head>
    <style>
        div {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: red;
            animation-name: color;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }

        @keyframes color {
            0% {
                background-color: red;
            }

            25% {
                background-color: yellow;
            }

            50% {
                background-color: green;
            }

            75% {
                background-color: blue;
            }

            100% {
                background-color: purple;
            }
        }
    </style>
</head>
<body>

    <div></div>

</body>
</html>
