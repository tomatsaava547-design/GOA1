    <!DOCTYPE html>
    <html>
<head>
    <title>Designs</title>

    <style>
        body {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 300px;
            height: 200px;
            background-color: green;
            position: relative;
        }

        .blue {
            width: 220px;
            height: 120px;
            background-color: #176477;
            position: absolute;
            top: 40px;
            left: 25px;
        }

        .orange {
            width: 90px;
            height: 90px;
            background-color: orange;
            position: absolute;
        }

        .one {
            top: 0;
            left: 0;
        }

        .two {
            top: 20px;
            left: 90px;
        }

        .three {
            top: 0;
            right: 0;
        }

        .four {
            bottom: 0;
            left: 0;
        }

        .five {
            top: 55px;
            left: 105px;
        }

        .six {
            bottom: 0;
            right: 0;
        }
     </style>

    </head>

<body>

    <div class="box">
        <div class="blue"></div>
        <div class="orange one"></div>
    </div>

    <div class="box">
        <div class="blue"></div>
        <div class="orange two"></div>
    </div>

    <div class="box">
        <div class="blue"></div>
        <div class="orange three"></div>
    </div>

    <div class="box">
        <div class="blue"></div>
        <div class="orange four"></div>
    </div>

    <div class="box">
        <div class="blue"></div>
        <div class="orange five"></div>
    </div>

    <div class="box">
        <div class="blue"></div>
        <div class="orange six"></div>
    </div>

</body>
</html>
