```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>

    <style>
        body {
            background-color: #f4d04e;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: white;
            width: 320px;
            padding: 20px;
            border: 1px solid black;
            border-radius: 15px;
            box-shadow: 8px 8px 0 black;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        .category {
            background-color: #f4d04e;
            display: inline-block;
            padding: 6px 10px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
        }

        .date {
            font-size: 14px;
        }

        h1 {
            font-size: 24px;
        }

        p {
            color: #6b6b6b;
            line-height: 1.5;
        }

        .author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-weight: bold;
        }

        .author img {
            width: 35px;
            height: 35px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="images/illustration-article.svg">

        <div class="category">Learning</div>

        <p class="date">Published 21 Dec 2023</p>

        <h1></h1>

        <p>

        </p>

        <div class="author">
            <img src="images/image-avatar.webp">
            <span>Greg Hooper</span>
        </div>

    </div>

</body>
</html>
