<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>

    <style>
        body {
            background-color: #d5e1ef;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .card {
            background-color: white;
            width: 280px;
            padding: 16px;
            border-radius: 20px;
            text-align: center;
            margin: 100px auto;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        h2 {
            color: #1f3251;
            font-size: 22px;
            margin: 20px 0;
        }

        p {
            color: #68778d;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="qr.png" alt="QR Code">

        <h2></h2>

        <p>scan qr.</p>
    </div>

</body>
</html>
