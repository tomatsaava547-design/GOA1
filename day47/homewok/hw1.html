<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Social Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #141414;
      font-family: Arial, sans-serif;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 330px;
      background: #252525;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    .profile-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      margin: 5px 0 10px;
    }

    .location {
      color: #d8ff00;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .bio {
      color: #ddd;
      margin-bottom: 25px;
    }

    .link {
      display: block;
      background: #eeeeee;
      color: #222;
      text-decoration: none;

      padding: 14px;
      margin: 12px 0;

      border-radius: 8px;
      font-weight: bold;
    }

    .link:hover {
      background: #d8ff00;
      transform: scale(1.02);
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      class="profile-img"
      src="https://i.pravatar.cc/150?img=47"
      alt="Profile picture"
    >

    <h1>Jessica Randall</h1>

    <div class="location">
      London, United Kingdom
    </div>

    <p class="bio">
      "Front-end developer and avid reader."
    </p>

    <a class="link" href="#">GitHub</a>

    <a class="link" href="#">Frontend Mentor</a>

    <a class="link" href="#">LinkedIn</a>

    <a class="link" href="#">Twitter</a>

    <a class="link" href="#">Instagram</a>

  </div>

</body>
</html>
