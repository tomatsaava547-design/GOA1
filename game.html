<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>3D ლაბირინთი: ეგზოტიკური ულტიმატუმი</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
            pointer-events: none;
            background: rgba(10, 10, 20, 0.8);
            padding: 12px 25px;
            border-radius: 15px;
            border: 2px solid #00ffcc;
            display: flex;
            gap: 25px;
        }
        #announcement {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0055;
            display: none;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>ლეველი: <span id="lvl">1</span></div>
        <div>ქულა: <span id="pts">0</span> / <span id="max-pts">5</span></div>
        <div>სიცოცხლე: <span id="hp">❤️❤️❤️</span></div>
        <div>სიჩქარე: <span id="spd">ნორმალური</span></div>
    </div>
    <div id="announcement">ფრთხილად!</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.035);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // განათება
        const ambientLight = new THREE.AmbientLight(0x222244);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.5);
        dirLight.position.set(10, 30, 20);
        scene.add(dirLight);

        // გლობალური ცვლადები
        let score = 0, level = 1, lives = 3, moveSpeed = 0.09;
        let walls = [], coins = [], enemies = [], powerups = [];

        // მოთამაშე (კიბერპანკ კუბი)
        const playerGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x004433, roughness: 0.1 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        scene.add(player);

        // იატაკი
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0b0b14, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        function createWall(x, z, w, d) {
            const wallGeo = new THREE.BoxGeometry(w, 2, d);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f1f3d, roughness: 0.3, metalness: 0.8 });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(x, 1, z);
            scene.add(wall);
            walls.push(wall);
        }

        function clearGame() {
            walls.forEach(w => scene.remove(w));
            coins.forEach(c => scene.remove(c));
            enemies.forEach(e => scene.remove(e));
            powerups.forEach(p => scene.remove(p));
            walls = []; coins = []; enemies = []; powerups = [];
        }

        function initLevel(l) {
            clearGame();
            player.position.set(0, 0.35, 0);
            score = 0;

            // საზღვრები
            createWall(0, -15, 30, 1);
            createWall(0, 15, 30, 1);
            createWall(-15, 0, 1, 30);
            createWall(15, 0, 1, 30);

            if (l === 1) {
                createWall(-5, -5, 10, 1);
                createWall(5, 5, 1, 10);
                spawnCoins([
                    {x: -8, z: -8}, {x: 8, z: 8}, {x: -8, z: 8}, {x: 8, z: -8}, {x: 0, z: -10}
                ]);
                spawnEnemies([
                    {x: -4, z: 2, minZ: -6, maxZ: 10, speed: 0.05}
                ]);
            } else {
                createWall(-6, -3, 1, 12);
                createWall(6, 3, 12, 1);
                createWall(0, -8, 8, 1);
                spawnCoins([
                    {x: -10, z: -10}, {x: 10, z: 10}, {x: -10, z: 10}, {x: 10, z: -10}, {x: 0, z: 0}
                ]);
                spawnEnemies([
                    {x: -7, z: 5, minZ: -8, maxZ: 12, speed: 0.07},
                    {x: 8, z: -5, minX: -10, maxX: 10, speed: 0.06, axis: 'x'}
                ]);
            }

            document.getElementById('pts').innerText = score;
            document.getElementById('max-pts').innerText = coins.length;
            document.getElementById('lvl').innerText = level;
        }

        function spawnCoins(posList) {
            const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200, metalness: 0.9 });
            posList.forEach(pos => {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(pos.x, 0.3, pos.z);
                scene.add(coin);
                coins.push(coin);
            });
        }

        function spawnEnemies(dataList) {
            const enemyGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x550022 });
            dataList.forEach(data => {
                const enemy = new THREE.Mesh(enemyGeo, enemyMat);
                enemy.position.set(data.x, 0.35, data.z);
                scene.add(enemy);
                enemies.push({ mesh: enemy, data: data });
            });
        }

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function checkCollision(nx, nz) {
            const pBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(nx, 0.35, nz),
                new THREE.Vector3(0.7, 0.7, 0.7)
            );
            for (let w of walls) {
                if (pBox.intersectsBox(new THREE.Box3().setFromObject(w))) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            let nx = player.position.x;
            let nz = player.position.z;

            if (keys['arrowup'] || keys['w']) nz -= moveSpeed;
            if (keys['arrowdown'] || keys['s']) nz += moveSpeed;
            if (keys['arrowleft'] || keys['a']) nx -= moveSpeed;
            if (keys['arrowright'] || keys['d']) nx += moveSpeed;

            if (!checkCollision(nx, player.position.z)) player.position.x = nx;
            if (!checkCollision(player.position.x, nz)) player.position.z = nz;

            // მტრების მოძრაობა
            enemies.forEach(item => {
                if (item.data.axis === 'x') {
                    item.mesh.position.x += item.data.speed;
                    if (item.mesh.position.x > 12 || item.mesh.position.x < -12) item.data.speed *= -1;
                } else {
                    item.mesh.position.z += item.data.speed;
                    if (item.mesh.position.z > item.data.maxZ || item.mesh.position.z < item.data.minZ) item.data.speed *= -1;
                }

                if (player.position.distanceTo(item.mesh.position) < 0.7) {
                    lives--;
                    document.getElementById('hp').innerText = "❤️".repeat(Math.max(0, lives));
                    player.position.set(0, 0.35, 0);
                    if (lives <= 0) {
                        alert("თამაში დასრულდა!");
                        lives = 3; level = 1;
                        document.getElementById('hp').innerText = "❤️❤️❤️";
                        initLevel(level);
                    }
                }
            });

            // მონეტების შეგროვება
            coins.forEach((coin, idx) => {
                coin.rotation.z += 0.05;
                if (player.position.distanceTo(coin.position) < 0.7) {
                    scene.remove(coin);
                    coins.splice(idx, 1);
                    score++;
                    document.getElementById('pts').innerText = score;

                    if (coins.length === 0) {
                        level++;
                        alert("შენ გადადიხარ შემდეგ ლეველზე: " + level);
                        if (level > 2) level = 1;
                        initLevel(level);
                    }
                }
            });

            // დინამიური კამერა
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 7;
            camera.position.y = 8;
            camera.lookAt(player.position.x, 0, player.position.z);

            renderer.render(scene, camera);
        }

        initLevel(level);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
